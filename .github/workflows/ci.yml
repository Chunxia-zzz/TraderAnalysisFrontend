name: ci

on:
  push:
    branches: [main]
    paths-ignore: ['docs/**', '**/*.md']   # 纯文档改动不跑（specs/** 的 .md 同样跳过）
  pull_request:
    paths-ignore: ['docs/**', '**/*.md']

# 串行化同一分支的 run，避免旧提交的结果覆盖新提交
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

# 显式声明最小权限：check job 只读代码 + 上传产物；security job 需要只读内容
permissions:
  contents: read

jobs:
  # ── L1+L2 检查流水线：锁文件安装 → ESLint → 单测 → 生产构建 ────────────────
  # 门槛与本地 `bash scripts/check.sh` **字面同源**：CI 不另写命令，直接执行同一份脚本。
  # 这是为了排除「本地两套、CI 一套」导致的假绿/假红。
  #
  # 不做 OS 矩阵：纯 JS 无平台分支代码（无路径分隔符断言、无权限位、无平台二进制名），
  # Windows 侧由开发者本地跑同一个 check.sh 覆盖。后端做矩阵是因为有 kill_unix/kill_windows 分支。
  check:
    name: check (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: ['22']
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Run check (npm ci + eslint + vitest + vite build)
        # --fresh 强制走 npm ci：CI runner 上没有 node_modules，本来也会走，
        # 但显式传参让「这一步在做什么」不依赖对脚本内部逻辑的猜测。
        run: bash scripts/check.sh --fresh

      - name: Upload dist artifact
        uses: actions/upload-artifact@v7
        with:
          name: dist-${{ github.sha }}
          path: dist
          retention-days: 7
          if-no-files-found: error   # 构建成功却没有产物 = 门禁有问题，必须暴露

  # ── L2 安全扫描：全历史密钥扫描（独立 job，不阻塞上游）─────────────────────
  # 独立成 job 的意义：密钥泄露与「代码写得好不好」无关，不能被前者掩盖。
  security:
    name: secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0   # 全历史扫描，只扫本次 diff 会漏掉历史泄露
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ── CD：把 check 产出的那一份 dist 发到线上（specs/004-deploy-on-green）───────
  # 三条硬约束，缺一不可：
  #   1) needs: [check]  —— 部署是检查的下游，不是并行的另一条路
  #   2) 只 push main    —— PR 通过检查也不上线（否则每个 PR 都能改生产）
  #   3) 用 artifact     —— 上线的必须是 CI 验证过的同一份字节，不重新构建
  #
  # 目录约定（服务器）：
  #   /var/www/trader-frontend        线上，Nginx 静态根（不变）
  #   /var/www/trader-frontend.new    暂存，先传到这里再校验
  #   /var/www/trader-frontend.prev   上一版，回滚锚点，只保留 1 份
  deploy:
    name: deploy (static → ${{ vars.DEPLOY_HOST || '47.106.175.84' }})
    needs: [check]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # 与 workflow 级 concurrency 分开：连续两次推送时，部署必须排队而不是互相覆盖
    concurrency:
      group: deploy-main
      cancel-in-progress: false
    env:
      DEPLOY_HOST: ${{ vars.DEPLOY_HOST || '47.106.175.84' }}
      RUN_ID: ${{ github.run_id }}
      LIVE_DIR: /var/www/trader-frontend
      NEW_DIR: /var/www/trader-frontend.new
      PREV_DIR: /var/www/trader-frontend.prev
      # 切换期间的标记：回滚只在这个标记属于本次运行时才执行。
      # 否则「上传阶段就失败」会被误判成「切换失败」，把上一版的旧产物盖到线上。
      SWAP_MARK: /var/www/.deploy-in-progress
    steps:
      - name: Checkout pinned host key only
        # deploy 不构建代码，本来不需要整个仓库；但主机公钥钉在 .github/deploy_known_hosts 里，
        # 必须 checkout 才能读到。用 sparse checkout 只取这一个文件（首次失败就是漏了这一步：
        # 「cp: cannot stat '.github/deploy_known_hosts'」）。
        uses: actions/checkout@v7
        with:
          sparse-checkout: .github/deploy_known_hosts
          sparse-checkout-cone-mode: false

      - name: Download dist artifact
        uses: actions/download-artifact@v8
        with:
          name: dist-${{ github.sha }}
          path: dist

      - name: Verify artifact has index.html
        run: |
          set -euo pipefail
          if [ ! -f dist/index.html ]; then
            echo "::error::artifact 里没有 index.html，拒绝部署（sha=${{ github.sha }}）"
            exit 1
          fi
          echo "产物文件数: $(find dist -type f | wc -l)，大小: $(du -sh dist | cut -f1)"

      - name: Prepare SSH key
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          set -euo pipefail
          # 缺 secret 时必须明确失败：静默跳过会让「部署成功」变成谎言
          if [ -z "${DEPLOY_SSH_KEY:-}" ]; then
            echo "::error::缺少 secret DEPLOY_SSH_KEY。添加方式见 specs/004-deploy-on-green/plan.md §3"
            exit 1
          fi
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy
          chmod 600 ~/.ssh/deploy
          # 先验密钥本身：粘贴被截断 / 尾部混入多余字符时，这里报错比 ssh 的
          # "Load key: invalid format" 更容易定位（实测这类错误最常见）
          ssh-keygen -y -f ~/.ssh/deploy > /dev/null 2>&1 \
            || { echo "::error::DEPLOY_SSH_KEY 不是合法的 OpenSSH 私钥（检查是否粘贴完整）"; exit 1; }
          # 主机公钥已钉在仓库里（.github/deploy_known_hosts）：不跑 ssh-keyscan。
          # 运行时扫描等于「第一次见到的就是真的」，中间人可在那一刻换掉公钥；
          # 钉住之后 StrictHostKeyChecking=yes 才有意义。
          [ -f .github/deploy_known_hosts ] \
            || { echo "::error::缺少 .github/deploy_known_hosts（deploy job 的 sparse checkout 是否被跳过？）"; exit 1; }
          cp .github/deploy_known_hosts ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Upload and swap (single SSH session)
        # 上传与切换合并在同一个 SSH 会话里：远端 shell 在 `tar -xzf -` 读完 stdin 后
        # 会继续执行后面的命令，没有理由为此再开一次连接（每次连接 = 一条登录记录）。
        #
        # 一次部署只建立 **1 个** SSH 连接（失败时回滚步骤会再建 1 个）。
        # tar 管道而不是 rsync：服务器（Alibaba Cloud Linux 3）没有 rsync，
        # 也不该为一次部署去装包。set -o pipefail 必须加 —— 否则 tar 失败
        # 会被 ssh 的 0 退出码吞掉，变成假绿。
        run: |
          set -euo pipefail
          tar -czf - -C dist . | ssh -i ~/.ssh/deploy -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes -o BatchMode=yes root@$DEPLOY_HOST "set -e
              echo '[1/3] 解包到暂存目录'
              rm -rf $NEW_DIR
              mkdir -p $NEW_DIR
              tar -xzf - -C $NEW_DIR
              test -f $NEW_DIR/index.html || { echo '暂存目录缺少 index.html'; exit 1; }
              echo \"      文件数: \$(find $NEW_DIR -type f | wc -l)\"
              echo '[2/3] 切换线上目录（旧版留作 .prev）'
              echo '$RUN_ID' > $SWAP_MARK
              rm -rf $PREV_DIR
              if [ -d $LIVE_DIR ]; then mv $LIVE_DIR $PREV_DIR; fi
              mv $NEW_DIR $LIVE_DIR
              rm -f $SWAP_MARK
              echo \"[3/3] 切换完成 sha=${{ github.sha }} \$(date -u +%FT%TZ)\""

      - name: Health check
        # 四断言：能访问 / 挂载点存在 / Cache-Control 恰好 1 个 / 带哈希的资源可取回。
        # 第三条来自 constitution §三：用 expires 会输出两个同名头，必须挡住。
        run: |
          set -euo pipefail
          BASE="http://$DEPLOY_HOST"
          code=$(curl -sS -o /tmp/index.html -w '%{http_code}' --retry 3 --retry-delay 2 "$BASE/")
          if [ "$code" != "200" ]; then echo "::error::首页返回 $code"; exit 1; fi
          grep -q 'id="app"' /tmp/index.html || { echo "::error::页面缺少 #app 挂载点"; exit 1; }
          cc=$(curl -sS -D- -o /dev/null "$BASE/" | grep -ci 'cache-control' || true)
          if [ "$cc" != "1" ]; then echo "::error::Cache-Control 头数量=$cc，应为 1（检查 Nginx 是否用了 expires）"; exit 1; fi
          asset=$(grep -o '/assets/[^"]*\.js' /tmp/index.html | head -1)
          if [ -z "$asset" ]; then echo "::error::首页没有引用任何 JS 资源"; exit 1; fi
          ac=$(curl -sS -o /dev/null -w '%{http_code}' "$BASE$asset")
          if [ "$ac" != "200" ]; then echo "::error::资源 $asset 返回 $ac"; exit 1; fi
          echo "健康检查通过：200 / #app / Cache-Control=1 / $asset=200"

      - name: Rollback to previous release
        # GitHub Actions 没有 try/catch，失败后正常步骤会被跳过，if: failure() 是唯一补偿点。
        # 只有「本次运行确实切换过」才回滚：上传阶段失败时线上从未被改动，回滚反而会倒退一个版本。
        if: failure()
        run: |
          set -euo pipefail
          [ -f ~/.ssh/deploy ] || { echo "::warning::SSH 未就绪，无法回滚（线上未被修改）"; exit 0; }
          ssh -i ~/.ssh/deploy -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            -o BatchMode=yes root@$DEPLOY_HOST "set -e
            if [ -f $SWAP_MARK ] && [ \"\$(cat $SWAP_MARK)\" = '$RUN_ID' ]; then
              if [ -d $PREV_DIR ]; then
                rm -rf $LIVE_DIR
                mv $PREV_DIR $LIVE_DIR
                rm -f $SWAP_MARK
                echo '已回滚到上一版'
              else
                rm -f $SWAP_MARK
                echo '本次切换前无线上目录（首次部署），无可回滚'
              fi
            else
              echo '本次运行未执行目录切换，线上未被改动，无需回滚'
            fi"
          echo "回滚后首页状态码: $(curl -sS -o /dev/null -w '%{http_code}' "http://$DEPLOY_HOST/")"
